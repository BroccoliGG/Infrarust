name: Latest Build

on:
  push:
    branches: [ main ]
    paths:
      - 'crates/**'
      - 'plugins/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/latest-build.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-build:
    name: Check and build (linux-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Admin Frontend
        uses: ./.github/actions/build-frontend

      - name: Check formatting
        run: cargo fmt -- --check
        
      - name: Run clippy
        run: cargo clippy -- -D warnings
        
      - name: Run tests
        run: cargo test

      - name: Build
        run: cargo build --release
        
      - name: Rename binary
        run: mv target/release/infrarust target/release/infrarust-latest-linux-${{ matrix.arch }}
          
      - name: Upload latest build
        uses: actions/upload-artifact@v4
        with:
          name: infrarust-latest-linux-${{ matrix.arch }}
          path: target/release/infrarust-latest-linux-${{ matrix.arch }}
